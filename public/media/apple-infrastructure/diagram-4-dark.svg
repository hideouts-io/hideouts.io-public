<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 347.9549999999999 711.1999999999999" width="347.9549999999999" height="711.1999999999999" style="--bg:#0f1216;--fg:#e7eaee;--accent:#5eead4;--surface:#161b21;--border:#2a313a">
<style>
  
  text { font-family: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Register" data-to="Generate" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="173.97749999999996,76.9 173.97749999999996,124.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Generate" data-to="Fetch" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="173.97749999999996,161.8 173.97749999999996,209.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Fetch" data-to="Fail" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="173.97749999999996,246.70000000000002 173.97749999999996,294.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Fail" data-to="Retry" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="173.97749999999996,331.6 173.97749999999996,379.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Retry" data-to="Activate" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="173.97749999999996,416.5 173.97749999999996,464.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Activate" data-to="Success" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="173.97749999999996,501.4 173.97749999999996,549.4" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Success" data-to="Cache" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="173.97749999999996,586.3 173.97749999999996,634.3" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Register" data-label="Register Akamai token agent" data-shape="rectangle">
  <rect x="70.38099999999997" y="40" width="207.19299999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="173.97749999999996" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Register Akamai token agent</text>
</g>
<g class="node" data-id="Generate" data-label="Generate token batch" data-shape="rectangle">
  <rect x="90.75849999999997" y="124.9" width="166.438" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="173.97749999999996" y="143.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Generate token batch</text>
</g>
<g class="node" data-id="Fetch" data-label="Attempt token fetch" data-shape="rectangle">
  <rect x="99.65049999999997" y="209.8" width="148.654" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="173.97749999999996" y="228.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Attempt token fetch</text>
</g>
<g class="node" data-id="Fail" data-label="QUIC token fetch failure" data-shape="rectangle">
  <rect x="85.94199999999995" y="294.70000000000005" width="176.07100000000003" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="173.97749999999996" y="313.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">QUIC token fetch failure</text>
</g>
<g class="node" data-id="Retry" data-label="Subsequent token generation / request" data-shape="rectangle">
  <rect x="40" y="379.6" width="267.9549999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="173.97749999999996" y="398.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Subsequent token generation / request</text>
</g>
<g class="node" data-id="Activate" data-label="Activate 30 tokens" data-shape="rectangle">
  <rect x="99.65049999999997" y="464.5" width="148.654" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="173.97749999999996" y="482.95" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Activate 30 tokens</text>
</g>
<g class="node" data-id="Success" data-label="Token fetch successful" data-shape="rectangle">
  <rect x="84.83049999999997" y="549.4" width="178.29399999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="173.97749999999996" y="567.85" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Token fetch successful</text>
</g>
<g class="node" data-id="Cache" data-label="Cache 30 Akamai tokens" data-shape="rectangle">
  <rect x="81.49599999999998" y="634.3" width="184.96299999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="173.97749999999996" y="652.75" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Cache 30 Akamai tokens</text>
</g>
</svg>