<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <rect width="920" height="440" fill="#0d1117" rx="10"/>
  <rect x="20" y="20" width="880" height="400" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="8"/>
  <text x="40" y="55" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,monospace" font-size="16" font-weight="bold">TRUST MODEL: Image4 (IMG4) Personalization &amp; FDR Cryptographic Chain</text>
  <text x="40" y="80" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,monospace" font-size="12">Source: /usr/lib/libimg4.dylib, libauthinstall.dylib &amp; /System/Library/FDR/</text>

  <!-- Box 1: Hardware Identity -->
  <rect x="40" y="110" width="200" height="280" fill="#0d1117" stroke="#388bfd" rx="6"/>
  <text x="55" y="140" fill="#58a6ff" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="bold">1. Hardware Identity</text>
  <text x="55" y="165" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Device-Specific Anchors</text>
  <rect x="55" y="180" width="170" height="35" fill="#161b22" stroke="#388bfd" rx="4"/>
  <text x="65" y="202" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="11">ECID &amp; Board ID</text>
  <rect x="55" y="225" width="170" height="35" fill="#161b22" stroke="#388bfd" rx="4"/>
  <text x="65" y="247" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="11">T2 / SEP Nonce</text>
  <text x="55" y="285" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Injected by Bootloader</text>
  <text x="55" y="305" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Ephemeral Challenge</text>
  <text x="55" y="325" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Anti-Replay Protection</text>
  <text x="55" y="365" fill="#58a6ff" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Chip: __img4_chip_x86</text>

  <!-- Box 2: TSS Ticket -->
  <rect x="265" y="110" width="200" height="280" fill="#0d1117" stroke="#d29922" rx="6"/>
  <text x="280" y="140" fill="#f0883e" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="bold">2. TSS Ticket (IM4M)</text>
  <text x="280" y="165" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Personalized Manifest</text>
  <rect x="280" y="180" width="170" height="35" fill="#161b22" stroke="#d29922" rx="4"/>
  <text x="290" y="202" fill="#f0883e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">AMAuthInstall</text>
  <rect x="280" y="225" width="170" height="35" fill="#161b22" stroke="#d29922" rx="4"/>
  <text x="290" y="247" fill="#f0883e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Apple Root CA Cert</text>
  <text x="280" y="285" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Signs Component Hashes</text>
  <text x="280" y="305" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Binds Nonce + ECID</text>
  <text x="280" y="325" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Grants Flash Authorization</text>
  <text x="280" y="365" fill="#f0883e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Verified by: libimg4</text>

  <!-- Box 3: FDR Anchors -->
  <rect x="490" y="110" width="200" height="280" fill="#0d1117" stroke="#a371f7" rx="6"/>
  <text x="505" y="140" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="bold">3. FDR Trust Object</text>
  <text x="505" y="165" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Factory Data Recovery</text>
  <rect x="505" y="180" width="170" height="35" fill="#161b22" stroke="#a371f7" rx="4"/>
  <text x="515" y="202" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="11">fdrtrustobject (2.8KB)</text>
  <rect x="505" y="225" width="170" height="35" fill="#161b22" stroke="#a371f7" rx="4"/>
  <text x="515" y="247" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="11">libFDR.dylib</text>
  <text x="505" y="285" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Restores ART Tables</text>
  <text x="505" y="305" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Display Calibration</text>
  <text x="505" y="325" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Sensor Pairing Keys</text>
  <text x="505" y="365" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Entitlement: fdr-access</text>

  <!-- Box 4: FIPS Crypto -->
  <rect x="715" y="110" width="165" height="280" fill="#0d1117" stroke="#2ea043" rx="6"/>
  <text x="730" y="140" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="bold">4. FIPS Validation</text>
  <text x="730" y="165" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Algorithm Self-Test</text>
  <rect x="725" y="180" width="145" height="35" fill="#161b22" stroke="#2ea043" rx="4"/>
  <text x="735" y="202" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="11">cc_fips_test</text>
  <text x="730" y="245" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• AES-GCM / XTS</text>
  <text x="730" y="265" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• SHA-256 / 384 / 512</text>
  <text x="730" y="285" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• ECDSA &amp; RSA PSS</text>
  <text x="730" y="305" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• HMAC-DRBG Entropy</text>
  <text x="730" y="365" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="11">FIPS 140-2 / 3 Pass</text>
</svg>
