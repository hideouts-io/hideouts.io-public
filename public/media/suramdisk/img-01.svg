<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <rect width="900" height="420" fill="#0d1117" rx="10"/>
  <rect x="20" y="20" width="860" height="380" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="8"/>
  <text x="40" y="55" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,monospace" font-size="16" font-weight="bold">RAW EVIDENCE: PurpleReverseProxy Loopback Configuration</text>
  <text x="40" y="80" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,monospace" font-size="12">Source: /System/Library/LaunchDaemons/com.apple.PurpleReverseProxy.ramdisk.plist</text>
  
  <rect x="40" y="105" width="820" height="270" fill="#0d1117" stroke="#21262d" rx="6"/>
  
  <text x="60" y="135" fill="#ff7b72" font-family="SFMono-Regular,Consolas,monospace" font-size="12">&lt;key&gt;Label&lt;/key&gt; &lt;string&gt;com.apple.PurpleReverseProxy.ramdisk&lt;/string&gt;</text>
  <text x="60" y="155" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="12">&lt;key&gt;ProgramArguments&lt;/key&gt; &lt;array&gt;&lt;string&gt;/usr/libexec/PurpleReverseProxy&lt;/string&gt;&lt;string&gt;-ramdisk&lt;/string&gt;&lt;/array&gt;</text>
  <text x="60" y="185" fill="#79c0ff" font-family="SFMono-Regular,Consolas,monospace" font-size="12">&lt;key&gt;Sockets&lt;/key&gt;</text>
  
  <!-- Port 1081 -->
  <rect x="60" y="200" width="240" height="150" fill="#161b22" stroke="#388bfd" stroke-width="1" rx="4"/>
  <text x="75" y="225" fill="#58a6ff" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="bold">Socket: socks</text>
  <text x="75" y="250" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="12">Port: 1081</text>
  <text x="75" y="270" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Family: IPv4 (127.0.0.1)</text>
  <text x="75" y="300" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Purpose: Payload stream &amp;</text>
  <text x="75" y="320" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="11">APFS disk image tunnel</text>

  <!-- Port 1082 -->
  <rect x="330" y="200" width="240" height="150" fill="#161b22" stroke="#d29922" stroke-width="1" rx="4"/>
  <text x="345" y="225" fill="#f0883e" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="bold">Socket: ctrl</text>
  <text x="345" y="250" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="12">Port: 1082</text>
  <text x="345" y="270" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Family: IPv4 (127.0.0.1)</text>
  <text x="345" y="300" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Purpose: Command &amp; Control</text>
  <text x="345" y="320" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="11">DFU restore transactions</text>

  <!-- Port 1084 -->
  <rect x="600" y="200" width="240" height="150" fill="#161b22" stroke="#a371f7" stroke-width="1" rx="4"/>
  <text x="615" y="225" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="bold">Socket: notify</text>
  <text x="615" y="250" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="12">Port: 1084</text>
  <text x="615" y="270" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Family: IPv4 (127.0.0.1)</text>
  <text x="615" y="300" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Purpose: Event notifications,</text>
  <text x="615" y="320" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="11">telemetry &amp; progress bus</text>
</svg>
