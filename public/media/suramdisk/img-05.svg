<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <rect width="920" height="440" fill="#0d1117" rx="10"/>
  <rect x="20" y="20" width="880" height="400" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="8"/>
  <text x="40" y="55" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,monospace" font-size="16" font-weight="bold">TOPOLOGY: Composite USB Device Descriptors &amp; Emulation Profiles</text>
  <text x="40" y="80" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,monospace" font-size="12">Source: /System/Library/AppleUSBDevice/USBDeviceConfiguration.plist</text>

  <!-- Box 1: standardRestore -->
  <rect x="40" y="110" width="200" height="280" fill="#0d1117" stroke="#388bfd" rx="6"/>
  <text x="55" y="140" fill="#58a6ff" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="bold">1. standardRestore</text>
  <text x="55" y="165" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Default DFU Profile</text>
  <rect x="55" y="180" width="170" height="45" fill="#161b22" stroke="#388bfd" rx="4"/>
  <text x="65" y="205" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="12">AppleUSBMux</text>
  <text x="55" y="250" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Primary Configurator Link</text>
  <text x="55" y="270" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Multiplexed Channel</text>
  <text x="55" y="290" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Low-latency IPC</text>
  <text x="55" y="350" fill="#58a6ff" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Default Configuration: YES</text>

  <!-- Box 2: standardMuxEthernet -->
  <rect x="265" y="110" width="200" height="280" fill="#0d1117" stroke="#d29922" rx="6"/>
  <text x="280" y="140" fill="#f0883e" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="bold">2. standardMuxEth</text>
  <text x="280" y="165" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">High-Throughput Restore</text>
  <rect x="280" y="180" width="170" height="35" fill="#161b22" stroke="#d29922" rx="4"/>
  <text x="290" y="202" fill="#f0883e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">AppleUSBMux</text>
  <rect x="280" y="225" width="170" height="35" fill="#161b22" stroke="#d29922" rx="4"/>
  <text x="290" y="247" fill="#f0883e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">AppleUSBEthernet</text>
  <text x="280" y="285" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Virtual USB NIC Bridge</text>
  <text x="280" y="305" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• High-speed APFS streaming</text>
  <text x="280" y="350" fill="#f0883e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Extended Config: YES</text>

  <!-- Box 3: stdMuxIDA -->
  <rect x="490" y="110" width="200" height="280" fill="#0d1117" stroke="#a371f7" rx="6"/>
  <text x="505" y="140" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="bold">3. stdMuxIDA</text>
  <text x="505" y="165" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Inter-Device Audio</text>
  <rect x="505" y="180" width="170" height="30" fill="#161b22" stroke="#a371f7" rx="4"/>
  <text x="515" y="200" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="10">AppleUSBMux</text>
  <rect x="505" y="215" width="170" height="30" fill="#161b22" stroke="#a371f7" rx="4"/>
  <text x="515" y="235" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="10">USBAudio2StreamIN/OUT</text>
  <rect x="505" y="250" width="170" height="30" fill="#161b22" stroke="#a371f7" rx="4"/>
  <text x="515" y="270" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="10">IDAMInterface</text>
  <text x="505" y="305" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• 4-Interface IAD Group</text>
  <text x="505" y="325" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Lossless PCM Stream</text>
  <text x="505" y="350" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Locked Config: YES</text>

  <!-- Box 4: usbiotest -->
  <rect x="715" y="110" width="165" height="280" fill="#0d1117" stroke="#2ea043" rx="6"/>
  <text x="730" y="140" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="bold">4. usbiotest</text>
  <text x="730" y="165" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Hardware Bus Testing</text>
  <rect x="725" y="180" width="145" height="30" fill="#161b22" stroke="#2ea043" rx="4"/>
  <text x="735" y="200" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="10">AppleUSBTestControl</text>
  <rect x="725" y="215" width="145" height="30" fill="#161b22" stroke="#2ea043" rx="4"/>
  <text x="735" y="235" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="10">AppleUSBTestBulk</text>
  <rect x="725" y="250" width="145" height="30" fill="#161b22" stroke="#2ea043" rx="4"/>
  <text x="735" y="270" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="10">AppleUSBTestInterrupt</text>
  <text x="730" y="305" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Eye Diagram Testing</text>
  <text x="730" y="325" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">• Signal Benchmarking</text>
  <text x="730" y="350" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Diagnostic Mode: YES</text>
</svg>
