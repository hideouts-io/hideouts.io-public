<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <rect width="920" height="460" fill="#0d1117" rx="10"/>
  <rect x="20" y="20" width="880" height="420" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="8"/>
  <text x="40" y="55" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,monospace" font-size="16" font-weight="bold">CATALOG: Embedded Hardware Firmware &amp; Option ROM (OFW) Payloads</text>
  <text x="40" y="80" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,monospace" font-size="12">Source: /usr/standalone/firmware/ (S4E, t302, USB-C_HPM, MCDP29XX, SLAM)</text>

  <!-- Box 1: S4E -->
  <rect x="40" y="110" width="260" height="300" fill="#0d1117" stroke="#388bfd" rx="6"/>
  <text x="55" y="135" fill="#58a6ff" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="bold">Apple S4E Controller</text>
  <text x="55" y="155" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Generation 1–4 PCIe SSDs</text>
  <text x="55" y="185" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Samsung MLC/iTLC</text>
  <text x="55" y="205" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">2D/3D (g2, g3, g4) 2-Plane 256Gb</text>
  <text x="55" y="235" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="11">SanDisk MLC/TLC/iTLC</text>
  <text x="55" y="255" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">2D 1z, 3D g3/g4 128-512Gb</text>
  <text x="55" y="285" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Toshiba / Kioxia</text>
  <text x="55" y="305" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">3D MLC/TLC/iTLC 170-256Gb</text>
  <text x="55" y="335" fill="#7ee787" font-family="SFMono-Regular,Consolas,monospace" font-size="11">SK Hynix TLC/iTLC</text>
  <text x="55" y="355" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">3D g3/g4 4-Plane 256-512Gb</text>
  <text x="55" y="390" fill="#58a6ff" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Total: 96 Package Aliases</text>

  <!-- Box 2: t302 -->
  <rect x="330" y="110" width="260" height="300" fill="#0d1117" stroke="#d29922" rx="6"/>
  <text x="345" y="135" fill="#f0883e" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="bold">Apple t302 Controller</text>
  <text x="345" y="155" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Generation 5 NVMe SSDs</text>
  <text x="345" y="185" fill="#f0883e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">bfh_ofw.t302.sandisk_*</text>
  <text x="345" y="205" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">3D TLC g5 2-Plane (512-1024GB)</text>
  <text x="345" y="235" fill="#f0883e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">bfh_ofw.t302.toshiba_*</text>
  <text x="345" y="255" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">3D TLC g5 2-Plane (512-1024GB)</text>
  <text x="345" y="285" fill="#f0883e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">bfh_ofw.t302.hynix_*</text>
  <text x="345" y="305" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">3D TLC g4/g5 4-Plane (512-1024GB)</text>
  <text x="345" y="335" fill="#f0883e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">.pak Mapping Tables</text>
  <text x="345" y="355" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">Hardware ID to binary bindings</text>
  <text x="345" y="390" fill="#f0883e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Total: 52 Package Aliases</text>

  <!-- Box 3: Power & Bridges -->
  <rect x="620" y="110" width="260" height="300" fill="#0d1117" stroke="#a371f7" rx="6"/>
  <text x="635" y="135" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="bold">Power &amp; Display Bridges</text>
  <text x="635" y="155" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="11">TI, Cypress &amp; MegaChips</text>
  <text x="635" y="185" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="11">USB-C_HPM (Power Delivery)</text>
  <text x="635" y="205" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">Revisions: 30, 31, 33, 34, 35, 46, 55</text>
  <text x="635" y="235" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="11">MCDP29XX DisplayPort</text>
  <text x="635" y="255" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">App: v1.136 | Driver: v1.10 (ISP)</text>
  <text x="635" y="285" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="11">SLAM.sefw (Secure Link)</text>
  <text x="635" y="305" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">Secure Enclave firmware (2.4 MB)</text>
  <text x="635" y="335" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Type-C Retimer Updater</text>
  <text x="635" y="355" fill="#e6edf3" font-family="SFMono-Regular,Consolas,monospace" font-size="10">I2C retimer bus initialization</text>
  <text x="635" y="390" fill="#bc8cff" font-family="SFMono-Regular,Consolas,monospace" font-size="11">Total: 30+ Controller Bins</text>
</svg>
