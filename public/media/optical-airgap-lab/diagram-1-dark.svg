</g>
<g class="node" data-id="I" data-label="Verified file under recovered/" data-shape="rectangle">
  <rect x="2039.3069999999998" y="40" width="213.86200000000002" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="2146.238" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Verified file under recovered/</text>
</g>
</svg>