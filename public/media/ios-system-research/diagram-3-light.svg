  <text x="277.63599999999997" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Software Update Components</text>
</g>
<g class="node" data-id="C" data-label="OTA-Related Services" data-shape="rectangle">
  <rect x="431.82599999999996" y="40" width="173.84799999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="518.75" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">OTA-Related Services</text>
</g>
